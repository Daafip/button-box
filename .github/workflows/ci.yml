name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The add-on manifest tests read config.yaml. Without PyYAML they skip
      # silently, which is worse than not having them.
      - run: pip install "PyYAML==6.0.3"
      - run: make check
