# Voice Note Box button node.
#
# One arcade button and one LED ring on a plain ESP32. The satellite stays a
# normal Assist device; this node only reports presses and shows state.
#
#   hold        -> Home Assistant arms voice note mode and starts recording
#   release     -> recording stops and the note is queued
#   short press -> play the oldest unread reply
#
# Short and long presses are separated here rather than in Home Assistant, so
# the distinction does not depend on network timing.

substitutions:
  name: voicenote-button
  friendly_name: Voice Note Button
  button_pin: GPIO16
  ring_pin: GPIO5
  ring_leds: "12"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret voicenote_button_api_key
  # The box depends on Home Assistant. When the connection drops, say so on
  # the ring instead of silently accepting presses that go nowhere.
  on_client_connected:
    - script.execute: show_state
  on_client_disconnected:
    - light.turn_on:
        id: ring
        brightness: 30%
        red: 100%
        green: 0%
        blue: 0%
        effect: offline

ota:
  - platform: esphome
    password: !secret voicenote_button_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Setup

captive_portal:

globals:
  - id: unread
    type: int
    restore_value: false
    initial_value: "0"
  - id: activity
    type: std::string
    restore_value: false
    initial_value: '"idle"'

binary_sensor:
  - platform: gpio
    id: box_button
    name: Button
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    # Published raw so Home Assistant can pair "held" with "released" and
    # stop the recording exactly when the button comes up.
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at least 200ms
        then:
          - homeassistant.event:
              event: esphome.voicenote_short_press
              data:
                device: ${name}

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: Ring
    pin: ${ring_pin}
    num_leds: ${ring_leds}
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 200ms
    effects:
      - pulse:
          name: waiting
          transition_length: 700ms
          update_interval: 1s
      - pulse:
          name: offline
          transition_length: 1.5s
          update_interval: 2s
      - pulse:
          name: sending
          transition_length: 250ms
          update_interval: 350ms

script:
  # One place decides what the ring shows, so the states cannot fight.
  - id: show_state
    mode: restart
    then:
      - lambda: |-
          auto call = id(ring).turn_on();
          const std::string state = id(activity);
          if (state == "recording") {
            call.set_rgb(1.0, 0.1, 0.1);
            call.set_brightness(1.0);
            call.set_effect("none");
          } else if (state == "sending") {
            call.set_rgb(1.0, 0.6, 0.0);
            call.set_brightness(0.7);
            call.set_effect("sending");
          } else if (state == "error") {
            call.set_rgb(1.0, 0.0, 0.0);
            call.set_brightness(0.4);
            call.set_effect("waiting");
          } else if (id(unread) > 0) {
            call.set_rgb(0.1, 0.4, 1.0);
            call.set_brightness(0.8);
            call.set_effect("waiting");
          } else {
            call.set_rgb(1.0, 1.0, 1.0);
            call.set_brightness(0.08);
            call.set_effect("none");
          }
          call.perform();

# The add-on publishes both of these over MQTT discovery.
sensor:
  - platform: homeassistant
    id: unread_count
    entity_id: sensor.voicenote_box_unread
    on_value:
      - lambda: id(unread) = (int) x;
      - script.execute: show_state

text_sensor:
  - platform: homeassistant
    id: activity_state
    entity_id: sensor.voicenote_box_activity
    on_value:
      - lambda: id(activity) = x;
      - script.execute: show_state
